</div></main><script>
(() => {
  const stringsNode = document.getElementById('StorefrontStrings');
  if (!stringsNode) return;
  const words = JSON.parse(stringsNode.textContent);
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  const root = document.body.dataset;
  const cartDialog = document.getElementById('CartDialog');
  let cartBusy = false;
  let cartRequest = 0;
  let cartSnapshot = null;
  const money = (amount, currency = words.currency) => new Intl.NumberFormat(words.locale, { style: 'currency', currency }).format(amount / 100);
  const element = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  const cartStatus = (message) => { cartDialog.querySelector('[data-cart-status]').textContent = message; };
  const cartCounts = (count) => document.querySelectorAll('[data-cart-count]').forEach(node => { node.textContent = count; });
  function displayCart(cart) {
    cartSnapshot = cart;
    const content = cartDialog.querySelector('[data-cart-content]');
    content.replaceChildren();
    cartCounts(cart.item_count);
    cartDialog.querySelector('[data-cart-summary]').hidden = cart.item_count === 0;
    cartDialog.querySelector('[data-cart-subtotal]').textContent = money(cart.total_price, cart.currency);
    if (!cart.item_count) {
      const empty = element('div', 'cart-empty');
      const link = element('a', 'button button--dark', words.continueShopping);
      link.href = words.shopUrl;
      empty.append(element('h3', '', words.cartEmpty), link);
      content.append(empty);
      return;
    }
    cart.items.forEach((item, index) => {
      const row = element('div', 'cart-line');
      if (item.image) {
        const img = element('img');
        img.src = item.image;
        img.alt = item.product_title;
        img.width = 90; img.height = 113; img.loading = 'lazy';
        row.append(img);
      } else { row.append(element('div')); }
      const info = element('div');
      const heading = element('h3');
      const link = element('a', '', item.product_title);
      link.href = item.url;
      heading.append(link); info.append(heading);
      if (item.variant_title && item.variant_title !== 'Default Title') info.append(element('p', '', item.variant_title));
      Object.entries(item.properties || {}).filter(([key,value]) => !key.startsWith('_') && value).forEach(([key,value]) => info.append(element('p', '', `${key}: ${value}`)));
      if (item.selling_plan_allocation) info.append(element('p', '', item.selling_plan_allocation.selling_plan.name));
      (item.line_level_discount_allocations || []).forEach(discount => info.append(element('p', '', discount.discount_application.title)));
      const bottom = element('div', 'cart-line__bottom');
      const quantityWrapper = element('div');
      const label = element('label', '', words.quantity);
      const input = element('input');
      input.type = 'number'; input.min = '0'; input.max = '99'; input.inputMode = 'numeric'; input.value = item.quantity;
      input.id = `DrawerQuantity-${index}`; input.dataset.cartKey = item.key;
      label.htmlFor = input.id;
      quantityWrapper.append(label, input);
      bottom.append(quantityWrapper, element('strong', '', money(item.final_line_price, cart.currency)));
      const remove = element('button', 'cart-remove', words.remove);
      remove.type = 'button'; remove.dataset.cartRemove = item.key;
      remove.setAttribute('aria-label', `${words.remove}: ${item.product_title}`);
      info.append(bottom, remove); row.append(info); content.append(row);
    });
  }
  async function getCart() {
    const request = ++cartRequest;
    cartStatus(words.loading);
    try {
      const response = await fetch(`${root.cartUrl}.js`, { headers: { Accept: 'application/json' } });
      if (!response.ok) throw new Error();
      const cart = await response.json();
      if (request !== cartRequest) return;
      displayCart(cart); cartStatus(''); return true;
    } catch { cartStatus(words.cartError); cartDialog.querySelector('[data-cart-summary]').hidden=true; const link=element('a','text-link',words.viewCart);link.href=root.cartUrl;cartDialog.querySelector('[data-cart-content]').replaceChildren(link); return false; }
  }
  async function changeCart(key, quantity) {
    if (cartBusy) return;
    cartBusy = true;
    cartRequest += 1;
    cartDialog.querySelectorAll('[data-cart-key],[data-cart-remove],button[name="checkout"]').forEach(node => { node.disabled = true; });
    cartStatus(words.loading);
    try {
      const response = await fetch(`${root.cartChangeUrl}.js`, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ id: key, quantity }) });
      const cart = await response.json();
      if (!response.ok) throw new Error(cart.description || words.cartError);
      displayCart(cart); cartStatus('');
      const updatedInput = [...cartDialog.querySelectorAll('[data-cart-key]')].find(input => input.dataset.cartKey === key);
      (updatedInput || cartDialog.querySelector('[data-close-dialog]')).focus();
    } catch (error) { if (cartSnapshot) displayCart(cartSnapshot); cartStatus(error.message || words.cartError); }
    finally { cartBusy = false; cartDialog.querySelectorAll('[data-cart-key],[data-cart-remove],button[name="checkout"]').forEach(node => { node.disabled = false; }); }
  }
  document.addEventListener('click', (event) => {
    const open = event.target.closest('[data-open-dialog]');
    if (open && !event.ctrlKey && !event.metaKey && !event.shiftKey && event.button === 0) {
      const dialog = document.getElementById(open.dataset.openDialog);
      if (dialog?.showModal) { event.preventDefault(); dialog.showModal(); if (dialog === cartDialog) getCart(); }
    }
    const close = event.target.closest('[data-close-dialog]');
    if (close) close.closest('dialog').close();
    if (event.target.closest('#MenuDialog nav a')) document.getElementById('MenuDialog').close();
    const remove = event.target.closest('[data-cart-remove]');
    if (remove) changeCart(remove.dataset.cartRemove, 0);
  });
  document.querySelectorAll('dialog').forEach(dialog => {
    dialog.addEventListener('keydown', event => { if (event.key === 'Escape') { event.preventDefault(); dialog.close(); } });
    dialog.addEventListener('click', event => {
      if (event.target !== dialog) return;
      const rect = dialog.getBoundingClientRect();
      if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
    });
  });
  document.addEventListener('change', (event) => {
    const quantity = event.target.closest('[data-cart-key]');
    if (quantity) {
      if (!quantity.checkValidity() || !Number.isInteger(Number(quantity.value))) { quantity.reportValidity(); return; }
      changeCart(quantity.dataset.cartKey, Number(quantity.value));
    }
    const select = event.target.closest('[data-variant-select]');
    if (select) {
      const section = select.closest('[data-product-section]');
      const option = select.selectedOptions[0];
      section.querySelector('[data-product-price]').textContent = option.dataset.price;
      const compare = section.querySelector('[data-product-compare]');
      compare.textContent = option.dataset.compare;
      compare.hidden = option.dataset.onSale !== 'true';
      const available = option.dataset.available === 'true';
      section.querySelector('[name="add"]').disabled = !available;
      section.querySelector('[data-add-label]').textContent = available ? words.add : words.soldOut;
      section.querySelector('[data-product-availability]').textContent = available ? words.available : words.soldOut;
      const url = new URL(location.href); url.searchParams.set('variant', option.value); history.replaceState({}, '', url);
      const media = [...section.querySelectorAll('[data-media-id]')].find(node => node.dataset.mediaId === option.dataset.mediaId);
      if (media) media.scrollIntoView({ block: 'nearest', inline: 'start', behavior: reduced.matches ? 'instant' : 'smooth' });
    }
  });
  document.addEventListener('submit', async (event) => {
    const form = event.target.closest('.product-form');
    if (!form || (event.submitter && event.submitter.name !== 'add') || !cartDialog?.showModal) return;
    event.preventDefault();
    const button = form.querySelector('[name="add"]');
    const label = button.querySelector('[data-add-label]');
    if (button.disabled) return;
    const errorNode = form.querySelector('[data-product-error]');
    const body = new FormData(form);
    button.disabled = true; label.textContent = words.adding; errorNode.hidden = true;
    try {
      const response = await fetch(`${root.cartAddUrl}.js`, { method: 'POST', body, headers: { Accept: 'application/json' } });
      const result = await response.json();
      if (!response.ok) throw new Error(result.description || result.message || words.cartError);
      cartDialog.showModal(); if (await getCart()) cartStatus(words.added);
    } catch (error) { errorNode.textContent = error.message || words.cartError; errorNode.hidden = false; }
    finally { button.disabled = false; label.textContent = words.add; }
  });
  const heroControllers = new WeakMap();
  function initHero(hero) {
    if (heroControllers.has(hero)) return;
    const video = hero.querySelector('video');
    const button = hero.querySelector('[data-motion-toggle]');
    if (!video || !button) return;
    video.muted = true; video.playsInline = true;
    let visible = false, userPaused = false, loaded = false;
    const updateLabel = () => { const paused = video.paused; button.classList.toggle('is-paused', paused); const label = paused ? button.dataset.playLabel : button.dataset.pauseLabel; button.setAttribute('aria-label', label); button.querySelector('[data-motion-label]').textContent = label; };
    const update = () => {
      const preventAuto = reduced.matches || navigator.connection?.saveData;
      button.hidden = Boolean(preventAuto);
      if (!visible || document.hidden || preventAuto || userPaused) { video.pause(); updateLabel(); return; }
      if (!loaded) { video.querySelectorAll('source[data-src]').forEach(source => { source.src = source.dataset.src; }); video.load(); loaded = true; }
      video.play().then(() => { video.classList.add('is-playing'); updateLabel(); }).catch(() => { updateLabel(); });
    };
    button.addEventListener('click', () => { userPaused = !userPaused; update(); });
    video.addEventListener('playing', () => { video.classList.add('is-playing'); updateLabel(); });
    video.addEventListener('pause', updateLabel);
    video.addEventListener('error', () => { video.classList.remove('is-playing'); button.hidden = true; });
    const observer = new IntersectionObserver(entries => { visible = entries[0].isIntersecting; update(); }, { threshold: 0.08 });
    observer.observe(hero);
    document.addEventListener('visibilitychange', update);
    reduced.addEventListener('change', update);
    heroControllers.set(hero, () => { observer.disconnect(); video.pause(); document.removeEventListener('visibilitychange', update); reduced.removeEventListener('change', update); });
  }
  const revealObserver = new IntersectionObserver(entries => entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('is-visible'); revealObserver.unobserve(entry.target); } }), { threshold: 0.08 });
  function initialize(scope = document) {
    scope.querySelectorAll('[data-hero]').forEach(initHero);
    scope.querySelectorAll('.reveal:not(.is-prepared)').forEach(node => { if (reduced.matches || node.getBoundingClientRect().top < innerHeight) { node.classList.add('is-visible'); return; } node.classList.add('is-prepared'); revealObserver.observe(node); });
    const desktopNav = document.querySelector('.desktop-nav');
    const mobileNav = document.querySelector('[data-mobile-nav]');
    if (desktopNav && mobileNav) mobileNav.replaceChildren(...[...desktopNav.children].map(node => node.cloneNode(true)));
  }
  document.addEventListener('click', event => {
    const trigger = event.target.closest('[data-feature]');
    if (trigger) {
      const section = trigger.closest('[data-engineering]');
      const selected = trigger.dataset.feature;
      section.querySelector('.engineering__stage').dataset.activeFeature = selected;
      section.querySelectorAll('.engineering-feature').forEach((feature, index) => {
        const active = String(index) === selected;
        feature.classList.toggle('is-active', active);
        feature.querySelector('button').setAttribute('aria-expanded', String(active));
        feature.querySelector('.engineering-feature__body').hidden = !active;
      });
      section.querySelectorAll('.hotspot').forEach(node => { const active = node.dataset.feature === selected; node.classList.toggle('is-active', active); node.setAttribute('aria-pressed', String(active)); });
    }
    const expand = event.target.closest('[data-construction-toggle]');
    if (expand) { const section = expand.closest('[data-engineering]'); const expanded = section.classList.toggle('is-expanded'); expand.setAttribute('aria-pressed', String(expanded)); }
  });
  document.addEventListener('shopify:section:load', event => initialize(event.target));
  document.addEventListener('shopify:section:unload', event => { event.target.querySelectorAll('[data-hero]').forEach(hero => heroControllers.get(hero)?.()); event.target.querySelectorAll('.reveal').forEach(node=>revealObserver.unobserve(node)); });
  initialize();
})();
</script><script src="../preview-shim.js"></script></body></html>
